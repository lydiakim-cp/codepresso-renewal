<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Survey Progress 미리보기</title>
  <!-- 실제 프로젝트 CSS(reset/tokens/base/components 전체)를 그대로 사용한다.
       tokens.css만 링크해 스타일을 따로 재구현하지 않는다. -->
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* 이 페이지에만 필요한 레이아웃(중앙 배치용 배경) — 컴포넌트 스타일은 없음 */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-bg-login-pre);
      padding: 48px 20px;
    }
  </style>
</head>

<body>
  <!-- index.html의 .hero-survey-frame 블록을 그대로 재사용한다 -->
  <div class="hero-survey-frame">
    <span class="hero-survey-glow" aria-hidden="true"></span>

    <div class="hero-survey-stack">
      <span class="hero-survey-pill">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
          <path d="M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9s1.3-6.5 3.8-9Z"
            stroke="currentColor" stroke-width="1.6" />
        </svg>
        AI 리터러시 자가 진단 (1분 소요)
      </span>

      <aside class="hero-survey" aria-label="AI 리터러시 진단 설문">
        <div class="hero-survey-nav">
          <button class="hero-survey-back" type="button" aria-label="이전 문항으로 돌아가기" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
          <div class="hero-survey-progress" role="progressbar" aria-valuenow="9" aria-valuemin="0"
            aria-valuemax="100">
            <span class="hero-survey-progress-bar" style="width:9%"></span>
            <span class="hero-survey-progress-dot" style="left:9%" aria-hidden="true"></span>
          </div>
        </div>

        <h3 class="hero-survey-question">새로운 업무나 과제를 맡았을 때, 어떤 방식으로 시작하시나요?</h3>

        <ul class="hero-survey-options">
          <li>
            <button class="hero-survey-option" type="button">
              <span>익숙한 기존 방식대로 시작하며, AI 활용은 특별히 고려하지 않는다.</span>
              <svg class="hero-survey-option-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </li>
          <li>
            <button class="hero-survey-option" type="button">
              <span>업무를 직접 진행하다가 막히거나 궁금한 점이 생길 때 AI를 활용한다.</span>
              <svg class="hero-survey-option-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </li>
          <li>
            <button class="hero-survey-option" type="button">
              <span>매번 설명하지 않아도 업무 맥락이 지속적으로 반영되는 AI 작업 환경을 구축해 두었다. (프로젝트 설정, 사내 지식 베이스 연동 등)</span>
              <svg class="hero-survey-option-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </li>
          <li>
            <button class="hero-survey-option" type="button">
              <span>업무의 특성에 맞춰 AI를 어떻게 활용할지 구상하고, 그에 맞게 계획해 실행한다.</span>
              <svg class="hero-survey-option-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
          </li>
        </ul>
      </aside>
    </div>
  </div>

  <!-- 실제 반영된 인터랙션 스크립트를 그대로 재사용한다 -->
  <script src="../js/hero-survey.js"></script>
</body>

</html>
